# Reverse proxy TLS devant l'API (S6). Monté en /etc/nginx/conf.d/default.conf (contexte http).
# Seul point d'entrée depuis le réseau : l'API, Grafana (/grafana/) et Prometheus (/prometheus/)
# ne sont joignables qu'ici, en HTTPS ; leurs ports ne sont publiés que sur 127.0.0.1 (EX-19).
log_format velov '$remote_addr [$time_iso8601] "$request" $status '
                 'rt=$request_time urt=$upstream_response_time';

# Ne pas annoncer la version de Nginx (en-tête Server, pages d'erreur) : moins d'indices pour un attaquant.
server_tokens off;

# Limite de débit par adresse IP, au-delà : 429. API : 100 req/s, au-dessus de toute capacité mesurée
# en S5 (environ 41 req/s en joblib, 80 en ONNX) : un test de charge depuis un poste n'est jamais
# coupé, seul un flot que l'API ne pourrait pas servir l'est. Prometheus : 10 req/s, contre l'essai
# de mots de passe en rafale sur l'authentification basique.
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=outils:10m rate=10r/s;
limit_req_status 429;

# Grafana Live passe par des WebSockets : Connection vaut upgrade seulement si le client le demande.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/velov.crt;
    ssl_certificate_key /etc/nginx/certs/velov.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_tickets off;   # pas de clé de ticket partagée : la confidentialité persistante est préservée
    access_log /var/log/nginx/access.log velov;

    # Un batch de 1000 prédictions pèse environ 150 Ko : 1 Mo laisse de la marge et coupe les envois abusifs.
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # En-têtes de sécurité. Pas de HSTS : les navigateurs l'ignorent pour une adresse IP, et avec un
    # certificat auto-signé il bloquerait l'accès au lieu de le protéger. À ajouter avec un nom de domaine (S7).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # DNS interne de Docker, relu toutes les 10 s : l'API recréée par release.sh peut changer d'adresse.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;
    set $grafana http://grafana:3000;
    set $prometheus http://prometheus:9090;

    # Les métriques restent dans le réseau du compose : Prometheus les lit sur api:8000.
    location = /metrics { return 404; }

    location / {
        limit_req zone=api burst=200 nodelay;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # Grafana sous /grafana/ (GF_SERVER_SERVE_FROM_SUB_PATH) : l'URI part telle quelle, préfixe compris.
    # Authentification : le compte de Grafana (mot de passe admin du .env, protection contre la force brute intégrée).
    location /grafana/ {
        proxy_pass $grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Prometheus n'a pas d'authentification à lui : le proxy en exige une (secrets/prometheus.htpasswd,
    # scripts/make_htpasswd.sh). Prometheus sert sur / et préfixe ses liens par /prometheus/ (--web.external-url).
    location /prometheus/ {
        limit_req zone=outils burst=50 nodelay;
        auth_basic "Prometheus velov";
        auth_basic_user_file /etc/nginx/secrets/prometheus.htpasswd;
        rewrite ^/prometheus/(.*)$ /$1 break;
        proxy_pass $prometheus;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
