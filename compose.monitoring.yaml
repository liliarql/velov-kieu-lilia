# Stack d'exploitation (S6) : reverse proxy TLS, Prometheus, Grafana.
# Complète compose.yaml et compose.mlflow.yaml : les trois fichiers se lancent toujours ensemble.
# Le plus sûr : déclarer la liste une fois dans .env, lue par toute commande docker compose
# (release.sh compris, qui sinon recréerait l'API avec le port 8000 publié) :
#
#   COMPOSE_FILE=compose.yaml:compose.mlflow.yaml:compose.monitoring.yaml
#   docker compose up -d
#   API        : https://<ip-de-la-vm>/              (443, via le proxy ; le port 8000 n'est plus publié)
#   Grafana    : https://<ip-de-la-vm>/grafana/      (compte admin, GRAFANA_ADMIN_PASSWORD)
#   Prometheus : https://<ip-de-la-vm>/prometheus/   (authentification basique, PROMETHEUS_WEB_PASSWORD)
#
# Sécurité (EX-19) : depuis le réseau, seul le proxy répond (80 redirigé, 443). Grafana et Prometheus
# ne publient leur port que sur 127.0.0.1, pour un diagnostic depuis la VM elle-même.
#
# Prérequis : certs/velov.crt et certs/velov.key (scripts/make_cert.sh), secrets/prometheus.htpasswd
# (scripts/make_htpasswd.sh), et dans .env : GRAFANA_ADMIN_PASSWORD, PROMETHEUS_WEB_PASSWORD, PUBLIC_HOST.

services:
  api:
    # L'API n'est plus joignable que par le proxy : on retire le port publié par compose.yaml.
    ports: !reset []

  db:
    # Joignable depuis la VM seulement (127.0.0.1), pour velov.monitor ; jamais depuis le réseau.
    ports:
      - "127.0.0.1:5432:5432"

  proxy:
    image: nginx:1.30-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/velov.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./secrets:/etc/nginx/secrets:ro
    depends_on:
      - api
    # Le maître Nginx démarre en root (ports 80 et 443) puis passe ses workers en utilisateur nginx :
    # il ne garde que les capacités nécessaires à ça, et aucune élévation de privilèges ensuite.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      # Servi derrière le proxy sous /prometheus/ : liens de l'interface préfixés, routes servies sur /.
      - --web.external-url=/prometheus/
      - --web.route-prefix=/
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      # Pas d'authentification dans Prometheus : jamais publié sur le réseau, le proxy en exige une.
      - "127.0.0.1:9090:9090"
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD manquant, voir .env.example}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Derrière le proxy, sous /grafana/ (S6, premier Should). PUBLIC_HOST : l'adresse de la VM.
      GF_SERVER_ROOT_URL: https://${PUBLIC_HOST:?PUBLIC_HOST manquant, voir .env.example}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Durcissement : cookies seulement en HTTPS et jamais envoyés par un autre site, ni inscription
      # ni accès anonyme, pas de partage vers le service public de snapshots, aucun appel sortant.
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"   # /api/health ne donne plus la version sans connexion
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      # Joignable par le proxy (https://<ip-vm>/grafana/) ; le port 3000 ne répond plus depuis le réseau.
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  promdata:
  grafanadata:
