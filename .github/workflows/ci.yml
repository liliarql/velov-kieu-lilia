# Intégration continue du projet Vélo'v (S4).
# À chaque push et pull request : lint, tests (code, contrat, modèle), scan de secrets,
# puis build de l'image et vérification qu'elle démarre et répond sur /ready.
#
# Les actions tierces sont épinglées par SHA de commit, pas par tag : un tag se déplace
# (incident trivy-action, mars 2026), un SHA non. Le commentaire garde la version lisible.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dépendances
        run: |
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint et format
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (code, contrat d'API, modèle, registre)
        env:
          MLFLOW_DISABLE_TELEMETRY: "true"
        run: pytest

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan des secrets (gitleaks 8.30.1, binaire vérifié par SHA-256)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git . --redact --no-banner --log-opts="--full-history HEAD"

  image:
    needs: [tests, secrets]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Modèle de test (le vrai modèle vient du registre, sur la VM)
        run: |
          pip install -r requirements.txt
          pip install -e .
          python -m velov.data --days 20 --stations 3
          python -m velov.train --version 0.0.0-ci
      - name: Build de l'image
        run: docker build -t "velov-api:ci-${GITHUB_SHA::7}" .
      - name: L'image démarre et répond sur /ready
        run: |
          docker run -d --name api -p 8000:8000 "velov-api:ci-${GITHUB_SHA::7}"
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
