
services:
  api:
    build:
      context: .
      args:
        VERSION: "${VERSION:-1.0.0}"
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
    # Tag = version + commit, e.g. velov-api:1.0.0-15d8eaa
    image: "velov-api:${VERSION:-1.0.0}-${GIT_COMMIT:-unknown}"
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: "postgresql://velov:${POSTGRES_PASSWORD:?}@db:5432/velov"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: velov
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      POSTGRES_DB: velov
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velov -d velov"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
