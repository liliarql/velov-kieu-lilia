
services:
  api:
    build: .
    image: velov-api:tp2
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: "postgresql://velov:${POSTGRES_PASSWORD:?}@db:5432/velov"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: velov
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      POSTGRES_DB: velov
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velov -d velov"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
